<!DOCTYPE html>
<html lang="fa">
    <head>
        <meta charset="UTF-8">
        <title>week_03 - html forms</title>
    </head>
    <body>

        <h1>فرم ثبت اطلاعات</h1>
    
    
    <form>

        <!-- text -->
         <label for="username">نام کاربری:</label>
         <input type="text" id="username" name="username"

         <br><br>

         <!-- password -->
          <label for="password">رمز عبور:</label>
            <input type="password" id="password" name="password">

            <br><br>

            <!-- number -->
             <label for="age">سن:</label>
                <input type="number" id="age" name="age">

                <br><br>

                <!-- checkbox -->
                 <p>زبان های مورد علاقه</p>

                 <input type="checkbox" id="html" name="language" value="HTML">
                    <label for="html">HTML</label>

                       <input type="checkbox" id="css" name="languages" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" name="languages" value="javascript">
        <label for="javascript">JavaScript</label>

        <br><br>

        <!-- Radio -->
        <p>سطح برنامه‌نویسی:</p>

        <input type="radio" id="beginner" name="level" value="beginner">
        <label for="beginner">مبتدی</label>

        <input type="radio" id="intermediate" name="level" value="intermediate">
        <label for="intermediate">متوسط</label>

        <input type="radio" id="advanced" name="level" value="advanced">
        <label for="advanced">پیشرفته</label>

        <br><br>

        <!-- Date -->
        <label for="birthdate">تاریخ تولد:</label>
        <input type="date" id="birthdate" name="birthdate">

        <br><br>

        <button type="submit">ارسال اطلاعات</button>

    </form>

</body>
</html>
